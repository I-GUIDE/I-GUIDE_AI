# I-GUIDE agent stack.
#
#   docker compose up --build      # launches the agent: embedding-server, mcp-server, agent-api
#   dashboard endpoint -> http://localhost:3500/agent/chat/stream
#
# Optional ingestion pipeline (needs MinIO):  docker compose --profile ingestion up
#
# All secrets / backends (OpenSearch, Neo4j, LLM keys, MinIO, Vision API) come from
# .env via `env_file`, which injects values LITERALLY — so passwords containing a `$`
# are passed unchanged. (Do NOT reference secrets with ${VAR} in this file: Compose
# would try to interpolate a `$` inside the value and silently corrupt it.)

services:
  embedding-server:
    build:
      context: .
      dockerfile: embedding-server/Dockerfile
    container_name: embedding-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iguide-network

  mcp-server:
    build:
      context: .
      dockerfile: MCP_server/Dockerfile
    container_name: mcp-server
    ports:
      - "8000:8000"
    environment:
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-mcp-server:*,127.0.0.1:*,localhost:*}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://mcp-server:*,http://127.0.0.1:*,http://localhost:*}
      - AGENT_FILE_STORAGE_ROOT=/app/agent_chat_files
    env_file:
      - .env
    volumes:
      - agent_chat_files:/app/agent_chat_files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - iguide-network

  # The agent API (api/server.py) — serves /agent/chat and /agent/chat/stream.
  agent-api:
    build:
      context: .
      dockerfile: rag_pipeline/Dockerfile
    container_name: agent-api
    ports:
      - "3500:5002"   # host:container — agent reachable on http://localhost:3500
    # Secrets + backend config (OPENSEARCH_*, NEO4J_*, ANVILGPT_*, VLLM_*/OPENAI_*) are
    # injected literally from .env below. Only fixed/defaulted values live here:
    environment:
      # Service wiring (override anything in .env)
      - FLASK_EMBEDDING_URL=http://embedding-server:5000
      - MCP_SERVER_URL=http://mcp-server:8000/mcp/
      - PORT=5002
      - AGENT_FILE_STORAGE_ROOT=/app/agent_chat_files
      # Search feature flags (defaults; override in .env if desired)
      - SPATIAL_BACKEND_ENABLED=${SPATIAL_BACKEND_ENABLED:-1}
      - SEMANTIC_BACKEND_ENABLED=${SEMANTIC_BACKEND_ENABLED:-1}
      - USE_LLM_ROUTER=${USE_LLM_ROUTER:-1}
      # gunicorn worker (process) count. Default 1: session memory + the checkpointer are
      # process-local, so multi-turn continuity needs ONE worker unless persistent memory
      # (OpenSearch) is on. Raise WEB_CONCURRENCY in .env only after enabling persistent memory.
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      # Agent runtime flags
      - AGENT_SUPERVISOR=${AGENT_SUPERVISOR:-1}
      - AGENT_DEV=${AGENT_DEV:-0}
      - AGENT_RECURSION_LIMIT=${AGENT_RECURSION_LIMIT:-60}
      # Sandboxed code execution (Docker-out-of-Docker). The agent shells out to the
      # HOST docker daemon (socket mounted below) to launch a hardened container per run.
      - AGENT_CODE_EXEC=${AGENT_CODE_EXEC:-1}
      - AGENT_CODE_EXEC_BACKEND=${AGENT_CODE_EXEC_BACKEND:-docker}
      - AGENT_CODE_EXEC_IMAGE=${AGENT_CODE_EXEC_IMAGE:-python:3.11-slim}
      # Per-run work dirs live here; the SAME absolute path is bind-mounted from the
      # host (below) so the host daemon can mount each run's dir into the sandbox.
      - AGENT_CODE_EXEC_WORK_ROOT=${AGENT_CODE_EXEC_WORK_ROOT:-/tmp/iguide_codeexec}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    # Root is required to access the mounted Docker socket. Mounting the socket grants
    # this container root-equivalent control of the host daemon — acceptable for local
    # dev; do NOT use this socket mount on a shared/production host.
    user: root
    volumes:
      - agent_chat_files:/app/agent_chat_files
      # Docker-out-of-Docker for code execution:
      - /var/run/docker.sock:/var/run/docker.sock
      # Share the per-run work dir at an IDENTICAL path on host and container so
      # `docker run -v <work>:/work` (issued from inside this container) resolves on the host.
      - /tmp/iguide_codeexec:/tmp/iguide_codeexec
    restart: unless-stopped
    depends_on:
      embedding-server:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - iguide-network

  # Ingestion pipeline (MinIO -> metadata -> OpenSearch). Not needed by the agent.
  # Start with:  docker compose --profile ingestion up
  metadata-extraction-server:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: metadata-extraction-server/Dockerfile
    container_name: metadata-extraction-server
    ports:
      - "5001:5001"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - iguide-network

networks:
  iguide-network:
    driver: bridge

volumes:
  agent_chat_files:
