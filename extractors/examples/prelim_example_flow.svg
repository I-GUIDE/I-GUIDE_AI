<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Preliminary worked example: extraction to grounded agent execution</title>
<desc id="d">A submitted notebook is extracted into the agent KB; a violent-crime heat-map query retrieves the blocks; the agent executes a mixed chain (extracted tools + a code-gen filter) passing GeoParquet file_ids; produces a validated heat map cited to the source element.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
</defs>
<text x="36" y="34" font-size="20" font-weight="700" fill="#0f172a">Preliminary worked example — notebook → agent KB → grounded execution</text>
<rect x="36" y="48" width="13" height="13" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="54" y="59" font-size="11.5" fill="#334155">extracted / reused (tool)</text>
<rect x="220" y="48" width="13" height="13" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="238" y="59" font-size="11.5" fill="#334155">written (code-gen)</text>
<rect x="372" y="48" width="13" height="13" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="390" y="59" font-size="11.5" fill="#334155">produced artifact (file_id)</text>
<rect x="560" y="48" width="13" height="13" rx="3" fill="#f5f3ff" stroke="#7c3aed"/><text x="578" y="59" font-size="11.5" fill="#334155">agent KB</text>
<text x="36" y="92" font-size="13" font-weight="700" fill="#6366f1">① SUBMIT &amp; EXTRACT</text>
<rect x="36" y="100" width="210" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
<text x="48" y="120" font-size="12.5" font-weight="600" fill="#0f172a">code_agent_analysis.ipynb</text>
<text x="48" y="136" font-size="10.5" fill="#475569">submitted via form → element_id ke_crimeagent</text>
<line x1="246" y1="123" x2="290" y2="123" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="290" y="100" width="150" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
<text x="300" y="120" font-size="12" font-weight="600" fill="#0f172a">NotebookExtractor</text>
<text x="300" y="136" font-size="10.5" fill="#475569">IPython-aware, AST</text>
<line x1="440" y1="123" x2="484" y2="123" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="484" y="86" width="580" height="78" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="498" y="104" font-size="12.5" font-weight="700" fill="#0f172a">Agent KB (agent-only index)  ·  element ke_crimeagent</text>
<text x="498" y="122" font-size="10.8" fill="#334155">NotebookBlocks (incl. block::7 — 5 spatial functions):</text>
<text x="498" y="138" font-size="10.3" font-family="ui-monospace,monospace" fill="#166534">load_chicago_crime_data · load_chicago_community_areas · spatial_join_and_count · filter · plot_choropleth_map</text>
<text x="498" y="156" font-size="10.5" fill="#475569">+ runnable workflow (mcp_run_…)   + SKILL (chicago-crime-code-agent)   + deps</text>
<text x="36" y="196" font-size="13" font-weight="700" fill="#0e7490">② QUERY &amp; RETRIEVE</text>
<rect x="36" y="204" width="232" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
<text x="48" y="224" font-size="12" font-weight="600" fill="#0f172a">user: "heat map of violent</text>
<text x="48" y="240" font-size="12" font-weight="600" fill="#0f172a">crime in Chicago"</text>
<line x1="268" y1="227" x2="312" y2="227" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="312" y="204" width="220" height="46" rx="8" fill="#ecfeff" stroke="#0e7490"/>
<text x="324" y="223" font-size="12" font-weight="600" fill="#0f172a">search peer · agent_kb_search</text>
<text x="324" y="239" font-size="10.5" fill="#475569">block hits → evidence (cite ke_crimeagent)</text>
<line x1="532" y1="227" x2="576" y2="227" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="576" y="204" width="220" height="46" rx="8" fill="#ecfeff" stroke="#0e7490"/>
<text x="588" y="223" font-size="12" font-weight="600" fill="#0f172a">get_kb_block(doc_id)</text>
<text x="588" y="239" font-size="10.5" fill="#475569">FULL source for verbatim reuse</text>
<line x1="686" y1="250" x2="686" y2="300" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
<text x="36" y="300" font-size="13" font-weight="700" fill="#b45309">③ EXECUTE — mixed chain (GeoDataFrames passed as file_id / GeoParquet)</text>
<rect x="36" y="314" width="232" height="70" rx="9" fill="#dcfce7" stroke="#16a34a"/>
<text x="48" y="333" font-size="11.5" font-weight="700" fill="#0f172a">A · TOOL (extracted)</text>
<text x="48" y="350" font-size="10.6" font-family="ui-monospace,monospace" fill="#166534">kb_run_geofunction(</text>
<text x="48" y="364" font-size="10.6" font-family="ui-monospace,monospace" fill="#166534">  load_chicago_crime_data)</text>
<text x="48" y="378" font-size="10" fill="#475569">reuses real Socrata URL</text>
<line x1="268" y1="349" x2="300" y2="349" stroke="#2563eb" stroke-width="1.4" marker-end="url(#af)"/>
<rect x="300" y="326" width="120" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="310" y="345" font-size="10.5" font-weight="600" fill="#0b2545">crime.parquet</text>
<text x="310" y="361" font-size="10" fill="#1e3a8a">file_id · 50,000</text>
<line x1="420" y1="349" x2="452" y2="349" stroke="#2563eb" stroke-width="1.4" marker-end="url(#af)"/>
<rect x="452" y="314" width="208" height="70" rx="9" fill="#fef3c7" stroke="#d97706"/>
<text x="464" y="333" font-size="11.5" font-weight="700" fill="#0f172a">B · CODE-GEN (written)</text>
<text x="464" y="350" font-size="10.6" font-family="ui-monospace,monospace" fill="#92400e">execute_code(filter</text>
<text x="464" y="364" font-size="10.6" font-family="ui-monospace,monospace" fill="#92400e">  violent, input_files=[A])</text>
<text x="464" y="378" font-size="10" fill="#475569">bespoke transform (set filter)</text>
<line x1="660" y1="349" x2="692" y2="349" stroke="#2563eb" stroke-width="1.4" marker-end="url(#af)"/>
<rect x="692" y="326" width="124" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="702" y="345" font-size="10.5" font-weight="600" fill="#0b2545">violent.parquet</text>
<text x="702" y="361" font-size="10" fill="#1e3a8a">file_id · 15,299</text>
<line x1="816" y1="349" x2="848" y2="349" stroke="#2563eb" stroke-width="1.4" marker-end="url(#af)"/>
<rect x="848" y="314" width="216" height="70" rx="9" fill="#dcfce7" stroke="#16a34a"/>
<text x="860" y="333" font-size="11.5" font-weight="700" fill="#0f172a">C · TOOL (heat map)</text>
<text x="860" y="350" font-size="10.6" font-family="ui-monospace,monospace" fill="#166534">kb_point_hotspot_map(</text>
<text x="860" y="364" font-size="10.6" font-family="ui-monospace,monospace" fill="#166534">  violent)</text>
<text x="860" y="378" font-size="10" fill="#475569">hexbin density → PNG</text>
<line x1="754" y1="372" x2="754" y2="404" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="560" y="404" width="392" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="572" y="423" font-size="10.6" font-family="ui-monospace,monospace" fill="#166534">spatial_join_and_count(community_areas, violent)  [extracted tool]</text>
<text x="572" y="437" font-size="10" fill="#475569">→ per-area counts file_id · top: Austin 922, South Shore 672, Near West 549</text>
<line x1="956" y1="384" x2="956" y2="470" stroke="#2563eb" stroke-width="1.4" marker-end="url(#af)"/>
<rect x="836" y="470" width="228" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="848" y="489" font-size="11" font-weight="700" fill="#0b2545">heatmap.png  (file_id)</text>
<text x="848" y="505" font-size="10" fill="#1e3a8a">validated vs live data ✓</text>
<text x="36" y="492" font-size="13" font-weight="700" fill="#16a34a">④ SYNTHESIZE</text>
<rect x="36" y="500" width="360" height="60" rx="9" fill="#f1f5f9" stroke="#64748b"/>
<text x="48" y="520" font-size="12" font-weight="600" fill="#0f172a">compose answer + grounding audit</text>
<text x="48" y="537" font-size="10.6" fill="#475569">cites the ORIGINAL element ke_crimeagent</text>
<text x="48" y="552" font-size="10.6" fill="#475569">returns heatmap.png artifact</text>
<line x1="396" y1="530" x2="828" y2="500" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
<rect x="36" y="588" width="1028" height="56" rx="9" fill="#fafafa" stroke="#e2e8f0"/>
<text x="50" y="610" font-size="12" font-weight="700" fill="#334155">Provenance / lineage (every step is a persisted file_id)</text>
<text x="50" y="630" font-size="11" font-family="ui-monospace,monospace" fill="#334155">crime.parquet[A·tool] → violent.parquet[B·code] → heatmap.png[C·tool]   ·   communities + violent → counts[extracted tool]   →  cite ke_crimeagent</text>
<text x="36" y="676" font-size="11" fill="#64748b">Reusable / expensive GIS = executed tools (reused extracted functions).  Small bespoke transforms = code-gen.  Both interoperate by passing files (file_id).</text>
<text x="36" y="694" font-size="11" fill="#64748b">Everything is grounded in and cited to the submitted notebook element; the violent-crime heat map is the only "written" analytical gap.</text>
</svg>
